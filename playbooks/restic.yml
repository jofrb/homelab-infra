---
# Install restic and configure daily backups of /data/photos to Backblaze B2,
# plus a monthly integrity check (restic check --read-data-subset=n/6).
#
# Prerequisites:
#   vault.yml must contain:
#     restic_b2_account_id:    <B2 application key ID>
#     restic_b2_account_key:   <B2 application key>
#     restic_repository_password: <strong passphrase for restic repo encryption>
#     healthchecks_ping_key:   <healthchecks.io project ping key>
#
#   healthchecks.io must have checks with slugs "restic-backup" and
#   "restic-check" in that project, otherwise pings 404 and no alerts fire.
#
# First-time repo init (run once after deploying this playbook):
#   systemctl start restic-backup.service   # will init the repo if it doesn't exist
#
# Or manually:
#   sudo -E restic -r b2:<bucket>: init
#
# Run:
#   ansible-playbook playbooks/restic.yml --ask-vault-pass

- name: Set up restic backups to Backblaze B2
  hosts: homelab
  become: true

  tasks:
    - name: Install restic and curl
      ansible.builtin.apt:
        name:
          - restic
          - curl
        state: present
        update_cache: true

    - name: Create /etc/restic
      ansible.builtin.file:
        path: /etc/restic
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create restic cache directory
      ansible.builtin.file:
        path: /var/cache/restic
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy restic environment file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/restic/restic.env.j2"
        dest: /etc/restic/b2.env
        owner: root
        group: root
        mode: "0600"
      notify: Reload systemd

    - name: Deploy restic backup script
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/restic/restic-backup.sh.j2"
        dest: /usr/local/bin/restic-backup
        owner: root
        group: root
        mode: "0750"

    - name: Deploy restic backup systemd service
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/restic/restic-backup.service.j2"
        dest: /etc/systemd/system/restic-backup.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Deploy restic backup systemd timer
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/restic/restic-backup.timer.j2"
        dest: /etc/systemd/system/restic-backup.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Enable and start restic backup timer
      ansible.builtin.systemd:
        name: restic-backup.timer
        enabled: true
        state: started

    - name: Create restic check state directory
      ansible.builtin.file:
        path: /var/lib/restic-check
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy restic check script
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/restic/restic-check.sh.j2"
        dest: /usr/local/bin/restic-check
        owner: root
        group: root
        mode: "0750"

    - name: Deploy restic check systemd service
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/restic/restic-check.service.j2"
        dest: /etc/systemd/system/restic-check.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Deploy restic check systemd timer
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/restic/restic-check.timer.j2"
        dest: /etc/systemd/system/restic-check.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Enable and start restic check timer
      ansible.builtin.systemd:
        name: restic-check.timer
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
