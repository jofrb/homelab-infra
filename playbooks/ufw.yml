---
- name: Configure firewall (ufw)
  hosts: homelab
  become: true

  tasks:
    # Allow SSH first — before enabling ufw — so we don't lock ourselves out.
    - name: Allow SSH from trusted networks
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ allowed_networks }}"

    - name: Set default policies and enable ufw
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Allow all outgoing traffic
      community.general.ufw:
        policy: allow
        direction: outgoing

    - name: Allow Immich from LAN
      community.general.ufw:
        rule: allow
        port: "2283"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ allowed_networks }}"

    - name: Allow container-to-container and container-to-host traffic (Podman)
      community.general.ufw:
        rule: allow
        src: "10.89.0.0/16"
        dest: "10.89.0.0/16"

    - name: Allow DNS from Podman containers to host
      community.general.ufw:
        rule: allow
        port: "53"
        proto: any
        src: "10.89.0.0/16"

    - name: Allow forwarding of Podman-published ports to containers
      community.general.ufw:
        rule: allow
        route: true
        proto: tcp
        dest: "10.89.0.0/16"
        port: "2283"
