# Shared variables for all hosts

# The dedicated Ansible system user created by bootstrap.yml.
# Must match ansible_user in inventory.yml / ansible.cfg.
ansible_deploy_user: ansible

# Path to the SSH public key deployed for the ansible user.
# Generate a dedicated key: ssh-keygen -t ed25519 -f ~/.ssh/ansible
ansible_public_key: "~/.ssh/ansible.pub"
# Networks allowed through the firewall.
allowed_networks:
  - "192.168.88.0/24"
